# Isolated transport experiment, intentionally no FUSE mount or inference policy.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /etc, /opt, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  browser_transport_probe:
    name: browser-transport-probe
    endpoints:
      - host: host.openshell.internal
        port: 18789
        protocol: rest
        tls: none
        allowed_ips: ["BRIDGE_ADDRESS/32"]
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /mcp }
          - allow: { method: GET, path: /mcp }
          - allow: { method: DELETE, path: /mcp }
    binaries:
      - { path: /usr/local/bin/openrind-browser-spike }
